name: Server CI

'on':
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      run_db_tests:
        description: Run DB integration tests (npm run test:db)
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.manual.outputs.run_ci || steps.filter.outputs.run_ci }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Mark manual dispatch as CI required
        id: manual
        if: github.event_name == 'workflow_dispatch'
        run: echo "run_ci=true" >> "$GITHUB_OUTPUT"

      # 문서/메타 파일만 수정된 경우 무거운 CI를 생략한다.
      - name: Detect logic-impacting changes
        id: filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            run_ci:
              - '**'
              - '!docs/**'
              - '!third-party/**'
              - '!.gitattributes'
              - '!.gitignore'
              - '!LICENSE'
              - '!README.md'

      - name: Print CI decision
        run: echo "run_ci=${{ steps.manual.outputs.run_ci || steps.filter.outputs.run_ci }}"

  server:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Sync OpenAPI docs
        run: npm run fix:openapi-drift
        working-directory: server

      - name: Detect OpenAPI doc changes
        id: openapi_changes
        run: |
          if git diff --quiet -- src/docs/openapi.ts; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: server

      - name: Fail on unsynced OpenAPI docs
        if: steps.openapi_changes.outputs.changed == 'true'
        run: |
          echo "OpenAPI docs were auto-synced from routes."
          echo "Run npm run fix:openapi-drift locally, commit src/docs/openapi.ts, and push again."
          git diff -- src/docs/openapi.ts
          exit 1
        working-directory: server

      - name: Check OpenAPI drift
        run: npm run check:openapi-drift
        working-directory: server

      - name: Test
        run: npm run test
        working-directory: server

      - name: Build
        run: npm run build
        working-directory: server

      - name: Check Flowmap drift
        run: npm run flowmap:check
        working-directory: server
  server-db:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.run_ci == 'true' && (github.event_name != 'workflow_dispatch' || inputs.run_db_tests) }}
    env:
      NODE_ENV: test
      SESSION_SECRET: ci-session-secret
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_NAME: mcmk
      DB_NAME_TEST: mcmk
      DB_USER: mcmk_app
      DB_PASSWORD: 1234
      AUDIT_CLI_LOG_LEVEL: none
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: mcmk
          POSTGRES_USER: mcmk_app
          POSTGRES_PASSWORD: 1234
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcmk_app -d mcmk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: server

      - name: Run DB migrations
        run: npm run db:migrate
        working-directory: server

      - name: Run DB tests
        run: npm run test:db
        working-directory: server
