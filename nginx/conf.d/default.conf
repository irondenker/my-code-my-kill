server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # `server=nginx` Response 에 뜨는 것 방지
    server_tokens off;
    more_clear_headers Server;

    # nginx-owned responses: edge/static/infra failures
    error_page 400 403 404 408 413 414 429 431 494 495 496 500 502 503 504 /errors/common/index.html?status=$status&source=nginx;

    location /errors/ {
        alias /var/www/errors/;
        try_files $uri $uri/ =404;
        # nginx 자체에서 error 응답이 발생할 경우에도, 예외없이 일정 보안 수준 이상의 CSP 및 no-sniff가 적용될 수 있도록 add_header 추가
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /uploads/ {
        alias /var/www/public/uploads/;
        try_files $uri =404;
        # nginx 자체에서 error 응답이 발생할 경우에도, 예외없이 일정 보안 수준 이상의 CSP 및 no-sniff가 적용될 수 있도록 add_header 추가
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; img-src 'self' data:; font-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        # Resolve Docker service DNS periodically to avoid stale upstream IP after container recreation.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream server:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # keep SSR-owned app errors (401/403/404/4xx/500) untouched
        proxy_intercept_errors off;
        # `X-Powered-By = Express` 제거
        proxy_hide_header X-Powered-By;
    }
}
