server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # nginx-owned responses: edge/static/infra failures
    error_page 403 /errors/403/index.html;
    error_page 404 /errors/404/index.html;
    error_page 500 /errors/500/index.html;
    error_page 503 /errors/503/index.html;
    error_page 504 /errors/504/index.html;
    error_page 400 408 413 414 429 431 494 495 496 502 /errors/edge/index.html?status=$status;

    location /errors/ {
        alias /var/www/errors/;
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        alias /var/www/public/assets/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /uploads/ {
        alias /var/www/public/uploads/;
        try_files $uri =404;
    }

    # qa route: force nginx-generated error responses
    location = /occur/nginx/400 { return 400; }
    location = /occur/nginx/403 { return 403; }
    location = /occur/nginx/404 { return 404; }
    location = /occur/nginx/408 { return 408; }
    location = /occur/nginx/413 { return 413; }
    location = /occur/nginx/414 { return 414; }
    location = /occur/nginx/429 { return 429; }
    location = /occur/nginx/431 { return 431; }
    location = /occur/nginx/494 { return 494; }
    location = /occur/nginx/495 { return 495; }
    location = /occur/nginx/496 { return 496; }
    location = /occur/nginx/500 { return 500; }
    location = /occur/nginx/502 { return 502; }
    location = /occur/nginx/503 { return 503; }
    location = /occur/nginx/504 { return 504; }

    location / {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # keep SSR-owned app errors (401/403/404/4xx/500) untouched
        proxy_intercept_errors off;
    }
}
