server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    error_page 403 /errors/403/index.html;
    error_page 404 /errors/404/index.html;
    error_page 500 /errors/500/index.html;
    error_page 503 /errors/503/index.html;
    error_page 504 /errors/504/index.html;

    location /errors/ {
        alias /var/www/errors/;
        try_files $uri $uri/ =404;
    }

    location /assets/ {
        alias /var/www/public/assets/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /uploads/ {
        alias /var/www/public/uploads/;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_intercept_errors on;
    }
}
