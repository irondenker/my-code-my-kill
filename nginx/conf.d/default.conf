server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    # `server=nginx` Response 에 뜨는 것 방지
    server_tokens off;

    # nginx-owned responses: edge/static/infra failures
    error_page 400 403 404 408 413 414 429 431 494 495 496 500 502 503 504 /errors/common/index.html?status=$status&source=nginx;

    location /errors/ {
        alias /var/www/errors/;
        try_files $uri $uri/ =404;
    }

    location /uploads/ {
        alias /var/www/public/uploads/;
        try_files $uri =404;
    }

    location / {
        # Resolve Docker service DNS periodically to avoid stale upstream IP after container recreation.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream server:3000;
        proxy_pass http://$upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # keep SSR-owned app errors (401/403/404/4xx/500) untouched
        proxy_intercept_errors off;
        # `X-Powered-By = Express` 제거
        proxy_hide_header X-Powered-By;
    }
}
