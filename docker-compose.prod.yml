name: my-code-my-kill

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    depends_on:
      - server
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./server/views/errors:/var/www/errors:ro
      - public_data:/var/www/public:ro

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: runtime
    env_file:
      - ./server/.env.production
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
    expose:
      - "3000"
    volumes:
      - public_data:/app/public
    networks:
      - default
      - db_net

volumes:
  public_data:

networks:
  db_net:
    external: true
    name: mcmk_db
