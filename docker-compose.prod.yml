name: my-code-my-kill

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: mcmk
      POSTGRES_USER: mcmk_app
      POSTGRES_PASSWORD: 1234
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - postgresql:/var/lib/postgresql
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
      target: runtime
    env_file:
      - ./server/.env.production
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      - db
    expose:
      - "3000"
    volumes:
      - public_uploads:/app/public/uploads
    networks:
      - default
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    depends_on:
      - server
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./server/views/errors:/var/www/errors:ro
      - public_uploads:/var/www/public/uploads:ro

volumes:
  postgresql:
    external: true
    name: postgresql
  public_uploads:

