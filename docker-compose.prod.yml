name: my-code-my-kill

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcmk
      POSTGRES_USER: mcmk_app
      POSTGRES_PASSWORD: 1234
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
    volumes:
      - postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
      target: runtime
    restart: unless-stopped
    env_file:
      - ./server/.env.production
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      AUDIT_CLI_LOG_LEVEL: errors
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - public_uploads:/app/public/uploads
    networks:
      - default
  migrator:
    build:
      context: ./server
      dockerfile: Dockerfile
    profiles:
      - tools
    env_file:
      - ./server/.env.production
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      AUDIT_CLI_LOG_LEVEL: errors
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./seed-assets:/seed-assets:ro
      - public_uploads:/app/public/uploads
    networks:
      - default
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./server/views/errors:/var/www/errors:ro
      - public_uploads:/var/www/public/uploads:ro

volumes:
  postgresql:
    name: postgresql_prod
  public_uploads:
