name: my-code-my-kill-dev

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: mcmk
      POSTGRES_USER: mcmk_app
      POSTGRES_PASSWORD: 1234
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "54321:5432"
    volumes:
      - postgresql:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    command: sh -c "npm install && npm run dev"
    ports:
      - "30000:3000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      AUDIT_CLI_LOG_LEVEL: errors
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
      - ./seed-assets:/seed-assets:ro
    networks:
      - default
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - server
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./server/views/errors:/var/www/errors:ro
      - ./server/public:/var/www/public:ro
    networks:
      - default

volumes:
  server_node_modules:
  postgresql:
    name: postgresql_dev
