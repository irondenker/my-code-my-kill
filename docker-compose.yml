name: my-code-my-kill-dev

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    networks:
      - default
      - db_net

volumes:
  server_node_modules:

networks:
  db_net:
    external: true
    name: mcmk_db
