name: my-code-my-kill-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: mcmk
      POSTGRES_USER: mcmk_app
      POSTGRES_PASSWORD: 1234
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "54973:5432"
    volumes:
      - postgresql:/var/lib/postgresql
  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 5432
      LAB_STORED_XSS: "${LAB_STORED_XSS:-false}"
    depends_on:
      - db
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
    networks:
      - default
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    depends_on:
      - server
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./server/views/errors:/var/www/errors:ro
      - ./server/public:/var/www/public:ro
    networks:
      - default

volumes:
  server_node_modules:
  postgresql:
    external: true
    name: postgresql

