<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Error</title>
    <link rel="stylesheet" type="text/css" href="/assets/css/fonts.css" />
    <link rel="stylesheet" type="text/css" href="/errors/common/style.css" />
  </head>
  <body data-error-code="__ERROR_CODE__" data-error-source="__ERROR_SOURCE__">
    <div class="container">
      <div class="error">
        <p class="kicker" id="edge-kicker">service layer</p>
        <h1 id="edge-code">4XX / 5XX</h1>
        <h2 id="edge-title">error</h2>
        <p class="message" id="edge-message">
          The request could not be completed.
        </p>
        <p class="subtitle" id="edge-subtitle">ERR_UNKNOWN</p>
      </div>

      <div class="stack-container" id="stack-primary" aria-hidden="true">
        <div id="server-network-connector">
          <img
            id="errorTag"
            src="/errors/common/error_ico.png"
            alt="timeout indicator" />
        </div>

        <div class="card-container">
          <div
            class="perspec"
            style="--spreaddist: 125px; --scaledist: 0.75; --vertdist: -25px">
            <div class="card">
              <div class="writing">
                <div class="topbar">
                  <div class="red"></div>
                  <div class="yellow"></div>
                  <div class="green"></div>
                </div>
                <div class="code">
                  <ul></ul>
                  <div class="centered-sign">
                    <img
                      class="question-sign"
                      src="/errors/common/sign_question.png"
                      alt="question sign" />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-container">
          <div
            class="perspec"
            style="--spreaddist: 100px; --scaledist: 0.8; --vertdist: -20px">
            <div class="card">
              <div class="writing">
                <div class="topbar">
                  <div class="red"></div>
                  <div class="yellow"></div>
                  <div class="green"></div>
                </div>
                <div class="code">
                  <ul></ul>
                  <div class="centered-sign">
                    <img
                      class="question-sign"
                      src="/errors/common/sign_question.png"
                      alt="question sign" />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-container">
          <div
            class="perspec"
            style="--spreaddist: 75px; --scaledist: 0.85; --vertdist: -15px">
            <div class="card">
              <div class="writing">
                <div class="topbar">
                  <div class="red"></div>
                  <div class="yellow"></div>
                  <div class="green"></div>
                </div>
                <div class="code">
                  <ul></ul>
                  <div class="centered-sign">
                    <img
                      class="question-sign"
                      src="/errors/common/sign_question.png"
                      alt="question sign" />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-container">
          <div
            class="perspec"
            style="--spreaddist: 50px; --scaledist: 0.9; --vertdist: -10px">
            <div class="card">
              <div class="writing">
                <div class="topbar">
                  <div class="red"></div>
                  <div class="yellow"></div>
                  <div class="green"></div>
                </div>
                <div class="code">

                  <div class="centered-sign">
                    <img

                      alt="question sign" />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="card-container">
          <div

            <div class="card">
              <div class="writing">
                <div class="topbar">

                </div>

              </div>

        </div>

          <div

            style="--spreaddist: 0px; --scaledist: 1; --vertdist: 0px">

              <div class="writing">
                <div class="topbar">
                  <div class="red"></div>
                  <div class="yellow"></div>
                  <div class="green"></div>
                </div>

                    <img

    </div>

      <p class="copyright">
        &copy; 2025-2026. Irondenker&trade; All rights reserved. Portions based

</html>
